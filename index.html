<!doctype html>
<html lang="id" data-theme="emerald">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ESSA Kids Therapy — Portal Operasional Klinik</title>

    <!-- 1. Google Fonts: Plus Jakarta Sans (Ramah & Modern) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- 2. DaisyUI v4 CSS & Tailwind CSS CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- 3. Konfigurasi Kustom Tailwind & CSS Tambahan -->
    <script src="./assets/js/config/tailwind.config.js"></script>
    <link rel="stylesheet" href="./assets/css/custom.css" />

    <!-- 4. Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- 5. Entry Point Modul JavaScript (Wajib dimuat SEBELUM Alpine.js) -->
    <script type="module" src="./assets/js/app.js"></script>

    <!-- 6. Alpine.js CDN (Wajib menggunakan atribut defer) -->
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.3/dist/cdn.min.js"
    ></script>
  </head>
  <body
    class="min-h-screen bg-base-200 font-sans text-base-content antialiased flex flex-col justify-center items-center p-4"
    x-data
  >
    <!-- Kontainer Utama Pemilihan Akses (Role Switcher Prototype) -->
    <main class="max-w-md w-full">
      <div class="card bg-base-100 shadow-xl border border-base-300">
        <div class="card-body items-center text-center">
          <!-- Identitas Klinik -->
          <div
            class="w-16 h-16 rounded-2xl bg-primary/10 flex items-center justify-center text-primary mb-2"
          >
            <i data-lucide="baby" class="w-9 h-9"></i>
          </div>
          <h1 class="text-2xl font-bold tracking-tight">ESSA Kids Therapy</h1>
          <p class="text-sm text-base-content/70 mb-6">
            Sistem Pendaftaran & Operasional Terapi Tumbuh Kembang Anak
          </p>

          <div
            class="divider text-xs text-base-content/50 uppercase tracking-wider my-1"
          >
            Pilih Akses Simulasi
          </div>

          <!-- Pilihan Role Aktor -->
          <div class="w-full space-y-3 mt-4">
            <!-- Akses Admin / Resepsionis (Desktop Optimized) -->
            <a
              href="./pages/admin/dashboard.html"
              class="btn btn-primary btn-block justify-between h-auto py-3 px-4 normal-case"
            >
              <div class="flex items-center gap-3 text-left">
                <i data-lucide="monitor" class="w-5 h-5 shrink-0"></i>
                <div>
                  <div class="font-bold text-sm">Admin & Resepsionis</div>
                  <div class="text-xs opacity-80 font-normal">
                    Pendaftaran, Paket Sesi, & Jadwal
                  </div>
                </div>
              </div>
              <i data-lucide="chevron-right" class="w-4 h-4"></i>
            </a>

            <!-- Akses Terapis (Desktop-First & Responsif) -->
            <a
              href="./pages/therapist/daily-schedule.html"
              class="btn btn-outline btn-secondary btn-block justify-between h-auto py-3 px-4 normal-case"
            >
              <div class="flex items-center gap-3 text-left">
                <i data-lucide="stethoscope" class="w-5 h-5 shrink-0"></i>
                <div>
                  <div class="font-bold text-sm">Portal Terapis</div>
                  <div class="text-xs opacity-80 font-normal">
                    Jadwal Harian & Catatan Evaluasi Sesi
                  </div>
                </div>
              </div>
              <i data-lucide="chevron-right" class="w-4 h-4"></i>
            </a>
          </div>

          <!-- Status Penyimpanan Lokal -->
          <div
            class="mt-6 pt-4 border-t border-base-200 w-full flex items-center justify-between text-xs text-base-content/60"
          >
            <span class="flex items-center gap-1.5">
              <i data-lucide="database" class="w-3.5 h-3.5 text-success"></i>
              Mode Prototype (LocalStorage)
            </span>
            <button
              type="button"
              @click="$store.clinic?.resetDatabase()"
              class="link link-hover text-error font-medium"
            >
              Reset Data Awal
            </button>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
